<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Bolt Netherlands vehicle eligibility list: which categories each car model can be used for, effective 1 January 2027.">
<title>Bolt Eligibility List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
:root{
  --bg:#FFFFFF;
  --surface:#F4F6F4;
  --surface-2:#E9EDEA;
  --line:#E2E7E3;
  --line-soft:#EDF0EE;
  --ink:#0D100E;
  --ink-2:#596159;
  --ink-3:#8B938C;
  --green:#34D186;
  --on-green:#06301E;
  --hero-bg:#0D100E;
  --hero-ink:#FFFFFF;
  --hero-ink-2:#A8B2AB;
  --hero-line:rgba(255,255,255,.18);
  --std-fg:#596159; --std-bg:#E9EDEA;
  --cmf-fg:#06301E; --cmf-bg:#34D186;
  --prm-fg:#D6F7E6; --prm-bg:#00311F;
  --focus:#00311F;
  --radius-lg:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D100E; --surface:#171B18; --surface-2:#212622; --line:#2B312D; --line-soft:#232924;
    --ink:#F2F5F3; --ink-2:#A3ACA6; --ink-3:#78817B;
    --green:#34D186; --on-green:#06301E;
    --hero-bg:#06261A; --hero-ink:#FFFFFF; --hero-ink-2:#9FB7AB; --hero-line:rgba(255,255,255,.2);
    --std-fg:#A3ACA6; --std-bg:#212622;
    --cmf-fg:#06301E; --cmf-bg:#34D186;
    --prm-fg:#06301E; --prm-bg:#9BE9C4;
    --focus:#34D186;
  }
}
:root[data-theme="dark"]{
  --bg:#0D100E; --surface:#171B18; --surface-2:#212622; --line:#2B312D; --line-soft:#232924;
  --ink:#F2F5F3; --ink-2:#A3ACA6; --ink-3:#78817B;
  --green:#34D186; --on-green:#06301E;
  --hero-bg:#06261A; --hero-ink:#FFFFFF; --hero-ink-2:#9FB7AB; --hero-line:rgba(255,255,255,.2);
  --std-fg:#A3ACA6; --std-bg:#212622;
  --cmf-fg:#06301E; --cmf-bg:#34D186;
  --prm-fg:#06301E; --prm-bg:#9BE9C4;
  --focus:#34D186;
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- hero ---------- */
.hero{background:var(--hero-bg);color:var(--hero-ink);padding:28px 24px 72px}
.hero-inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.topbar{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:16px;
}
.kicker{
  display:inline-flex;align-items:center;
  background:rgba(52,209,134,.14);color:var(--green);
  font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;
}
.langswitch{
  margin-left:auto;display:inline-flex;gap:2px;padding:3px;
  border:1px solid var(--hero-line);border-radius:999px;
}
.langswitch button{
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;
  color:var(--hero-ink-2);background:transparent;border:0;cursor:pointer;
  padding:6px 14px;border-radius:999px;min-height:32px;
}
.langswitch button:hover{color:var(--hero-ink)}
.langswitch button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
h1{
  font-weight:700;font-size:clamp(32px,5.4vw,58px);line-height:1.03;
  letter-spacing:-.035em;margin:0;max-width:18ch;text-wrap:balance;
}
.hero p{margin:0;color:var(--hero-ink-2);font-size:18px;max-width:56ch;line-height:1.5}

.effective{
  display:inline-flex;align-items:center;gap:10px;margin-top:4px;
  background:var(--green);color:var(--on-green);
  font-size:15px;font-weight:700;padding:9px 16px;border-radius:999px;
}
.effective .dot{width:8px;height:8px;border-radius:50%;background:var(--on-green)}
.notice{
  background:var(--surface);border-left:4px solid var(--green);
  border-radius:var(--radius-lg);padding:24px 28px;gap:12px;
}
.notice h2{font-size:clamp(19px,2.2vw,24px)}
.notice ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.notice li::marker{color:var(--green)}

/* ---------- page ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:56px 24px 88px;display:flex;flex-direction:column;gap:56px}
section{display:flex;flex-direction:column;gap:18px}
h2{font-weight:700;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.025em;margin:0}
.lede{margin:0;color:var(--ink-2);max-width:64ch;font-size:16px}

/* ---------- rule cards ---------- */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.rule{
  background:var(--surface);border-radius:var(--radius-lg);padding:24px;
  display:flex;flex-direction:column;gap:14px;
}
.cap{font-size:13px;color:var(--ink-2);font-weight:500;margin:0}
.cap b{color:var(--ink);font-weight:600}
.chain{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.step .age{min-width:72px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);font-size:13px}
.step .to{color:var(--ink-3)}

/* ---------- tags ---------- */
.tag{
  display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;
  padding:4px 11px;border-radius:999px;white-space:nowrap;
}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag.standard{color:var(--std-fg);background:var(--std-bg)}
.tag.comfort{color:var(--cmf-fg);background:var(--cmf-bg)}
.tag.premium{color:var(--prm-fg);background:var(--prm-bg)}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:16px 0 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  border-bottom:1px solid var(--line);
}
input[type="search"],select{
  font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--surface);border:1px solid transparent;border-radius:999px;
  padding:11px 18px;min-height:46px;
}
input[type="search"]{min-width:240px;flex:1 1 240px;max-width:340px}
select{cursor:pointer}
input::placeholder{color:var(--ink-3)}
input:hover,select:hover{border-color:var(--line)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}
.btn{
  font-family:inherit;font-size:15px;font-weight:600;
  border-radius:999px;padding:11px 20px;min-height:46px;cursor:pointer;
}
.btn-primary{color:var(--on-green);background:var(--green);border:0}
.btn-primary:hover{filter:brightness(.95)}
.btn-ghost{color:var(--ink-2);background:transparent;border:1px solid var(--line)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.count{margin-left:auto;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- brand groups ---------- */
.brands{display:flex;flex-direction:column;gap:10px}
.brand-group{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden}
.brand-group summary{
  list-style:none;cursor:pointer;padding:16px 22px;
  display:flex;align-items:center;gap:14px;
}
.brand-group summary::-webkit-details-marker{display:none}
.brand-group summary:hover{background:var(--surface-2)}
.chev{
  flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--ink-3);
  border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);
  transition:transform .18s ease;
}
.brand-group[open] > summary .chev{transform:rotate(45deg)}
.bname{font-weight:600;font-size:17px;letter-spacing:-.015em;flex:1 1 auto}
.bcount{font-size:13.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.modellist{list-style:none;margin:0;padding:0 22px 8px;display:flex;flex-direction:column}
.modellist li{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:11px 0;border-top:1px solid var(--line-soft);
}
.mname{font-weight:500;font-size:15px}
mark{background:rgba(52,209,134,.3);color:inherit;border-radius:3px;padding:0 1px}
.empty{
  background:var(--surface);border-radius:var(--radius-lg);
  padding:48px 24px;text-align:center;color:var(--ink-2);
}

/* ---------- checker ---------- */
.checker{background:var(--surface);border-radius:var(--radius-lg);padding:28px;gap:18px}
.chk-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field select{width:100%;background:var(--bg);border:1px solid var(--line)}
.field select:disabled{opacity:.55;cursor:not-allowed}
.chk-result{background:var(--hero-bg);color:var(--hero-ink);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.chk-result.waiting{background:var(--bg);color:var(--ink-2);border:1px dashed var(--line)}
.chk-result .res-label{font-size:13px;font-weight:600;color:var(--hero-ink-2)}
.chk-result .tags{justify-content:flex-start}
.chk-result .tag{font-size:14px;padding:6px 14px}
.chk-result .res-high{font-size:20px;font-weight:700;letter-spacing:-.015em}
.chk-result .res-note{font-size:13.5px;color:var(--hero-ink-2);margin:0}
.chk-missing{margin:0;font-size:14px;color:var(--ink-2)}
.chk-missing a{color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:3px}

.contact{background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--radius-lg);padding:32px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.contact h2{color:var(--hero-ink)}
.contact p{margin:6px 0 0;color:var(--hero-ink-2);max-width:52ch}
.contact .btn{display:inline-flex;align-items:center;text-decoration:none}
footer{background:var(--surface);padding:40px 24px 56px}
.footer-inner{
  max-width:78ch;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  font-size:13.5px;color:var(--ink-3);line-height:1.55;
}
@media (max-width:640px){
  .hero{padding:20px 18px 52px}
  .wrap{padding:40px 18px 64px;gap:44px}
  .count{margin-left:0;width:100%}
  .brand-group summary{padding:14px 18px;flex-wrap:wrap}
  .modellist{padding:0 18px 8px}
  .bname{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="hero">
  <div class="hero-inner">
    <div class="topbar">
      <div class="langswitch" role="group" data-i18n-label="langGroup">
        <button type="button" id="lang-en" lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lang-nl" lang="nl" aria-pressed="false">NL</button>

    <h1 data-i18n="h1"></h1>

</header>

<div class="wrap">

  <section class="checker" aria-labelledby="chk-heading">

  <section class="notice" aria-labelledby="notice-heading">

  <section>

          <div class="step"><span class="age" data-i18n="age8"></span><span class="to">&rarr;</span><span class="tag standard">Bolt</span></div>
        </div>
      </div>
      <div class="rule">
        <div><span class="tag comfort">Comfort</span></div>
        <p class="cap"><span data-i18n="maxAge"></span> <b data-i18n="sevenYears"></b></p>
        <div class="chain">
          <div class="step"><span class="age" data-i18n="age07"></span><span class="to">&rarr;</span><span class="tag comfort">Comfort</span></div>
          <div class="step"><span class="age" data-i18n="age8"></span><span class="to">&rarr;</span><span class="tag standard">Bolt</span></div>
        </div>
      </div>
      <div class="rule">
        <div><span class="tag standard">Bolt</span></div>
        <p class="cap" data-i18n="noStepDown"></p>
        <div class="chain">
          <div class="step"><span class="age" data-i18n="anyAge"></span><span class="to">&rarr;</span><span class="tag standard">Bolt</span></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 id="list-heading" data-i18n="listTitle"></h2>
    <p class="lede" data-i18n="listLede"></p>

    <div class="toolbar">
      <input type="search" id="q" autocomplete="off">
      <select id="cat">
        <option value="" data-i18n="allCats"></option>
        <option value="premium">Premium</option>
        <option value="comfort">Comfort</option>
        <option value="standard">Bolt</option>
      </select>
      <button class="btn btn-ghost" id="toggleAll" type="button"></button>
      <button class="btn btn-primary" id="reset" type="button" data-i18n="clear"></button>
      
    </div>

    <div class="brands" id="brands" aria-labelledby="list-heading"></div>
  </section>

  <section class="contact">
    <div>
      <h2 data-i18n="contactTitle"></h2>
      <p data-i18n="contactText"></p>
    </div>
    <a class="btn btn-primary" id="supportLink" href="mailto:netherlands@bolt.eu" target="_blank" rel="noopener" data-i18n="contactBtn"></a>
  </section>
</div>

eekr X","b":"Zeekr","c":"standard"}];
const ORDER = {premium:3, comfort:2, standard:1};
const TIERS = ['standard', 'comfort', 'premium'];

// A model cleared for a tier is also cleared for every tier below it, so the
// ladder is cumulative: a Premium car can serve Standard and Comfort too.
const eligible = top => TIERS.slice(0, ORDER[top]);
const LABEL = {standard:'Bolt', comfort:'Comfort', premium:'Premium'};

// Age rules for the checker. Age is counted as (year) - (year of first registration),
// from the year the rules start.
const RULES_FROM = 2027, PREMIUM_MAX_AGE = 6, COMFORT_MAX_AGE = 7, OLDEST_YEAR = 2000;
const REF_YEAR = Math.max(new Date().getFullYear(), RULES_FROM);
const BRANDS = [...new Set(DATA.map(x => x.b))].sort((a, b) => a.localeCompare(b));

const I18N = {

    allCats: 'Alle categorieën', catLabel: 'Filter op categorie',
    clear: 'Wissen', expandAll: 'Alles uitklappen', collapseAll: 'Alles inklappen',
    noMatch: 'Geen modellen gevonden met deze filters.',
    effective: 'Geldig vanaf 1 januari 2027',

const els = {
  q: document.getElementById('q'),
  cat: document.getElementById('cat'),
  brands: document.getElementById('brands'),
  reset: document.getElementById('reset'),
  toggleAll: document.getElementById('toggleAll'),
  en: document.getElementById('lang-en'),
  chkBrand: document.getElementById('chkBrand'),
  chkModel: document.getElementById('chkModel'),
  chkYear: document.getElementById('chkYear'),
  chkResult: document.getElementById('chkResult'),
  chkMissingLink: document.getElementById('chkMissingLink'),
  nl: document.getElementById('lang-nl')
};

let lang = 'en';
let allOpen = false;
const openBrands = new Set();

try {
  const saved = localStorage.getItem('bolt-nl-lang');
  if (saved === 'nl' || saved === 'en') lang = saved;
} catch (e) { /* storage unavailable; English stays */ }

const t = () => I18N[lang];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function highlight(name, q){
  if (!q) return esc(name);
  const i = name.toLowerCase().indexOf(q);
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) + '</mark>' + esc(name.slice(i + q.length));
}

function applyStatic(){
  const d = t();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = d[el.dataset.i18n];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-label]').forEach(el => {
    el.setAttribute('aria-label', d[el.dataset.i18nLabel]);
  });
  document.getElementById('supportLink').href = d.supportUrl;
  els.q.placeholder = d.searchPh;
  els.q.setAttribute('aria-label', d.searchLabel);
  els.cat.setAttribute('aria-label', d.catLabel);
  els.toggleAll.textContent = allOpen ? d.collapseAll : d.expandAll;
  els.en.setAttribute('aria-pressed', String(lang === 'en'));
  els.nl.setAttribute('aria-pressed', String(lang === 'nl'));
}

function render(){
  const d = t();
  const q = els.q.value.trim().toLowerCase();
  const catF = els.cat.value;

  // Filtering follows the tags: picking Comfort returns everything cleared for
  // Comfort, which includes Premium cars.
  const list = DATA.filter(x =>
    (!q || x.m.toLowerCase().includes(q)) && (!catF || ORDER[x.c] >= ORDER[catF]));

  const byBrand = new Map();
  list.forEach(x => {
    if (!byBrand.has(x.b)) byBrand.set(x.b, []);
    byBrand.get(x.b).push(x);
  });
  const brands = [...byBrand.keys()].sort((a, b) => a.localeCompare(b));

  els.toggleAll.textContent = allOpen ? d.collapseAll : d.expandAll;
  els.toggleAll.hidden = !brands.length;

  if (!brands.length){
    els.brands.innerHTML = '<div class="empty">' + esc(d.noMatch) + '</div>';
    return;
  }

  const filtering = Boolean(q || catF);

  els.brands.innerHTML = brands.map(b => {
    const models = byBrand.get(b).slice().sort((x, y) => x.m.localeCompare(y.m));
    const open = (filtering || allOpen || openBrands.has(b)) ? ' open' : '';
    return '<details class="brand-group"' + open + ' data-brand="' + esc(b) + '">'
      + '<summary><span class="chev" aria-hidden="true"></span>'
      + '<span class="bname">' + esc(b) + '</span>'
      + '</summary>'
      + '<ul class="modellist">'
      + models.map(x => '<li><span class="mname">' + highlight(x.m, q) + '</span>'
          + '<span class="tags">'
          + eligible(x.c).map(k => '<span class="tag ' + k + '">' + LABEL[k] + '</span>').join('')
          + '</span></li>').join('')
      + '</ul></details>';
  }).join('');

  els.brands.querySelectorAll('details').forEach(el => {
    el.addEventListener('toggle', () => {
      if (el.open) openBrands.add(el.dataset.brand);
      else openBrands.delete(el.dataset.brand);
    });
  });
}

function opt(value, label){ return '<option value="' + esc(String(value)) + '">' + esc(String(label)) + '</option>'; }

function fillChecker(){
  const d = t();
  const b = els.chkBrand.value, m = els.chkModel.value, y = els.chkYear.value;
  els.chkBrand.innerHTML = opt('', d.choose) + BRANDS.map(x => opt(x, x)).join('');
  els.chkBrand.value = b;
  fillModels(m);
  let years = '';
  for (let yr = REF_YEAR; yr >= OLDEST_YEAR; yr--) years += opt(yr, yr);
  els.chkYear.innerHTML = opt('', d.choose) + years;
  els.chkYear.value = y;
  els.chkMissingLink.href = d.supportUrl;
}

function fillModels(keep){
  const d = t();
  const b = els.chkBrand.value;
  if (!b){
    els.chkModel.innerHTML = opt('', d.chooseBrandFirst);
    els.chkModel.disabled = true;
    return;
  }
  const models = DATA.filter(x => x.b === b).map(x => x.m).sort((p, q) => p.localeCompare(q));
  els.chkModel.innerHTML = opt('', d.choose) + models.map(x => opt(x, x)).join('');
  els.chkModel.disabled = false;
  els.chkModel.value = models.includes(keep) ? keep : '';
}

function renderChecker(){
  const d = t();
  const car = DATA.find(x => x.b === els.chkBrand.value && x.m === els.chkModel.value);
  const year = parseInt(els.chkYear.value, 10);
  const box = els.chkResult;
  if (!car || !year){
    box.className = 'chk-result waiting';
    box.textContent = d.resPrompt;
    return;
  }
  const age = REF_YEAR - year;
  const ageLevel = age <= PREMIUM_MAX_AGE ? 3 : age <= COMFORT_MAX_AGE ? 2 : 1;
  const level = Math.min(ORDER[car.c], ageLevel);
  const top = TIERS[level - 1];
  let html = '<span class="res-label">' + esc(d.resTitle) + '</span>'
    + '<span class="tags">' + TIERS.slice(0, level).map(k => '<span class="tag ' + k + '">' + LABEL[k] + '</span>').join('') + '</span>'
    + '<span class="res-high">' + esc(d.resHigh(LABEL[top])) + '</span>'
    + '<p class="res-note">' + esc(d.resAge(age, REF_YEAR)) + '</p>';
  if (level < ORDER[car.c]) html += '<p class="res-note">' + esc(d.resStep(LABEL[car.c], LABEL[top])) + '</p>';
  box.className = 'chk-result';
  box.innerHTML = html;
}

els.chkBrand.addEventListener('change', () => { fillModels(''); renderChecker(); });
els.chkModel.addEventListener('change', renderChecker);
els.chkYear.addEventListener('change', renderChecker);

function setLang(next){
  lang = next;
  try { localStorage.setItem('bolt-nl-lang', next); } catch (e) { /* not persisted */ }
  applyStatic();
  fillChecker();
  renderChecker();
  render();
}

els.en.addEventListener('click', () => setLang('en'));
els.nl.addEventListener('click', () => setLang('nl'));
['q','cat'].forEach(id => els[id].addEventListener('input', render));
els.reset.addEventListener('click', () => {
  els.q.value = ''; els.cat.value = '';
  allOpen = false; openBrands.clear();
  render();
});
els.toggleAll.addEventListener('click', () => {
  allOpen = !allOpen;
  openBrands.clear();
  if (allOpen) [...new Set(DATA.map(x => x.b))].forEach(b => openBrands.add(b));
  render();
});

applyStatic();
fillChecker();
renderChecker();
render();
</script>
